<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Detail — Lone Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <div class="flex-between">
        <h1 id="loanTitle">Loan</h1>
        <span id="statusBadge"></span>
      </div>
      <div class="grid">
        <div class="stat"><div class="label">Borrower</div><div class="value" id="borrowerName" style="font-size:16px;">—</div></div>
        <div class="stat"><div class="label">Principal</div><div class="value" id="principal" style="font-size:16px;">—</div></div>
        <div class="stat"><div class="label">Interest Rate</div><div class="value" id="rate" style="font-size:16px;">—</div></div>
        <div class="stat"><div class="label">Balance Due (today)</div><div class="value" id="balanceDue" style="font-size:16px;">—</div></div>
      </div>
      <p class="muted" id="dates"></p>
      <button type="button" id="closeLoanBtn" class="secondary">Mark as Closed</button>
    </div>

    <div class="card">
      <h2>Record Payment</h2>
      <form id="paymentForm">
        <label for="amount">Amount (Rs.)</label>
        <input type="number" id="amount" step="0.01" min="0" required>
        <label for="paymentDate">Payment Date</label>
        <input type="date" id="paymentDate" required>
        <label for="method">Method</label>
        <select id="method">
          <option>Cash</option>
          <option>Bank Transfer</option>
          <option>Other</option>
        </select>
        <label for="note">Note</label>
        <input type="text" id="note">
        <button type="submit">Add Payment</button>
        <div class="error" id="err"></div>
      </form>
    </div>

    <div class="card">
      <h2>Payment History</h2>
      <table>
        <thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Note</th></tr></thead>
        <tbody id="paymentRows"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/loan-detail.js"></script>
</body>
</html>
