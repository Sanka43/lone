<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loans — Lone Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h2>New Loan</h2>
      <form id="loanForm">
        <label for="borrowerId">Borrower</label>
        <select id="borrowerId" required></select>
        <label for="principal">Principal Amount (Rs.)</label>
        <input type="number" id="principal" step="0.01" min="0" required>
        <label for="interestRate">Interest Rate (% per month, reducing balance)</label>
        <input type="number" id="interestRate" step="0.01" min="0" required>
        <label for="loanDate">Loan Date</label>
        <input type="date" id="loanDate" required>
        <label for="dueDate">Due Date (optional)</label>
        <input type="date" id="dueDate">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2"></textarea>
        <button type="submit">Create Loan</button>
        <div class="error" id="err"></div>
      </form>
    </div>

    <div class="card">
      <h2>All Loans</h2>
      <table>
        <thead><tr><th>Loan</th><th>Borrower</th><th>Principal</th><th>Balance Due</th><th>Status</th></tr></thead>
        <tbody id="loanRows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/loans.js"></script>
</body>
</html>
