<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borrowers — Lone Management</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <div class="container">
    <div class="card">
      <h2 id="formTitle">Add Borrower</h2>
      <form id="borrowerForm">
        <input type="hidden" id="borrowerId">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>
        <label for="nic">NIC</label>
        <input type="text" id="nic">
        <label for="phone">Phone</label>
        <input type="text" id="phone">
        <label for="address">Address</label>
        <textarea id="address" rows="2"></textarea>
        <button type="submit">Save Borrower</button>
        <button type="button" class="secondary" id="cancelEdit" style="display:none;">Cancel</button>
        <div class="error" id="err"></div>
      </form>
    </div>

    <div class="card">
      <h2>All Borrowers</h2>
      <table>
        <thead><tr><th>Name</th><th>NIC</th><th>Phone</th><th>Address</th><th></th></tr></thead>
        <tbody id="borrowerRows"><tr><td colspan="5" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/borrowers.js"></script>
</body>
</html>
